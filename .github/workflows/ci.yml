name: DevOps Intern Final CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  lint:
    name: Lint Scripts and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck scripts/sysinfo.sh
          shellcheck scripts/healthcheck.sh

      - name: Run Hadolint
        run: |
          docker run --rm \
            -i hadolint/hadolint:v2.12.0-alpine \
            < app/Dockerfile

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t nginx-app:${{ github.sha }} \
            ./app

      - name: Show image details
        run: docker images nginx-app

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t nginx-app:test \
            ./app

      - name: Start application
        run: |
          docker run -d \
            --name nginx-test \
            -p 8080:8080 \
            nginx-app:test

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to become ready."
          docker logs nginx-test
          exit 1

      - name: Run health check script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080

      - name: Check health endpoint
        run: |
          curl --fail http://localhost:8080/healthz

      - name: Stop test container
        if: always()
        run: docker rm -f nginx-test || true

  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            ./app

          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"